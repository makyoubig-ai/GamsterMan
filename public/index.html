<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark AFK Client - Console</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    header h1 { color: var(--accent); font-size: 24px; }
    .stats-bar { display: flex; gap: 15px; }
    .stat-box { background: var(--card-bg); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; }
    
    .grid-container { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
    @media (max-width: 1024px) { .grid-container { grid-template-columns: 1fr; } }
    
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .card h2 { font-size: 18px; margin-bottom: 15px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    
    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; margin-top: 10px; }
    input, textarea { width: 100%; background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
    textarea { resize: vertical; height: 80px; }
    button { background: var(--accent); color: #0f172a; border: none; padding: 10px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
    button:hover { background: var(--accent-hover); }
    
    .bot-card { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .bot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; }
    .bot-status { font-size: 12px; color: var(--success); }
    .bot-details { font-size: 12px; color: var(--text-muted); display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-bottom: 8px; }
    .bot-logs { background: #020617; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 11px; color: var(--text-muted); max-height: 60px; overflow-y: auto; margin-bottom: 8px; }
    
    .actions-row { display: flex; gap: 8px; }
    .btn-danger { background: var(--danger); color: white; width: auto; padding: 6px 12px; font-size: 12px; }
    .btn-danger:hover { background: #dc2626; }
    .btn-secondary { background: #475569; color: white; width: auto; padding: 6px 12px; font-size: 12px; }
    
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <h1>🚀 Dark AFK Client Console</h1>
    <div class="stats-bar">
      <div class="stat-box">RAM: <span id="ram-stat">0%</span></div>
      <div class="stat-box">CPU: <span id="cpu-stat">0%</span></div>
    </div>
  </header>

  <div class="grid-container">
    <!-- LEFT PANEL: DEPLOY & CONTROLS -->
    <div>
      <div class="card">
        <h2>Deploy Bots</h2>
        <label>Server IP:Port</label>
        <input type="text" id="server-ip" placeholder="gamester.org:25565">
        
        <label>Usernames (Comma Separated)</label>
        <textarea id="usernames" placeholder="BotOne, BotTwo, BotThree"></textarea>
        
        <label>Server Password (AuthMe)</label>
        <input type="password" id="password" placeholder="Optional password">
        
        <label>Proxies (SOCKS5 / IP:Port:User:Pass)</label>
        <textarea id="proxies" placeholder="192.168.1.50:1080&#10;192.168.1.51:1080"></textarea>
        
        <button onclick="deployBots()">Launch Bots</button>
      </div>

      <div class="card">
        <h2>Staff Evasion Manager</h2>
        <label>Add Staff Name</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="new-staff" placeholder="StaffUsername" style="margin-bottom:0;">
          <button onclick="addStaff()" style="width: auto;">Add</button>
        </div>
        <div id="staff-list" style="margin-top:10px; font-size:13px; color:var(--text-muted);"></div>
      </div>
    </div>

    <!-- RIGHT PANEL: ACTIVE BOTS & LOGS -->
    <div>
      <div class="card">
        <h2>Active Running Bots (<span id="active-count">0</span>)</h2>
        <div id="active-bots-container">
          <p style="color: var(--text-muted); font-size: 13px;">No active bots deployed yet.</p>
        </div>
      </div>

      <div class="card">
        <h2>Proxy-Down Section (<span id="proxy-down-count">0</span>)</h2>
        <div id="proxy-down-container">
          <p style="color: var(--text-muted); font-size: 13px;">No bots with dead proxies.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    function deployBots() {
      const serverIP = document.getElementById('server-ip').value.trim();
      const usernamesRaw = document.getElementById('usernames').value.trim();
      const password = document.getElementById('password').value.trim();
      const proxiesRaw = document.getElementById('proxies').value.trim();

      if (!serverIP || !usernamesRaw) {
        alert('Please fill in Server IP and Usernames!');
        return;
      }

      socket.emit('deploy_bots', { serverIP, usernamesRaw, password, proxiesRaw });
    }

    socket.on('deploy_success', msg => alert(msg));
    socket.on('deploy_error', err => alert(err));

    socket.on('dashboard_update', data => {
      document.getElementById('ram-stat').innerText = data.system.ramUsage + '%';
      document.getElementById('cpu-stat').innerText = data.system.cpuLoad + '%';
      document.getElementById('active-count').innerText = data.active.length;
      document.getElementById('proxy-down-count').innerText = data.proxyDown.length;

      // Staff list render
      document.getElementById('staff-list').innerHTML = data.staff.map(s => 
        `<span>${s} <button onclick="removeStaff('${s}')" class="btn-danger" style="padding:2px 6px; font-size:10px; margin-left:5px;">X</button></span>`
      ).join(' ');

      // Active bots render
      const activeContainer = document.getElementById('active-bots-container');
      if (data.active.length === 0) {
        activeContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 13px;">No active bots deployed yet.</p>';
      } else {
        activeContainer.innerHTML = data.active.map(b => `
          <div class="bot-card">
            <div class="bot-header">
              <span>${b.username} <span style="font-size:11px; color:var(--text-muted);">(${b.server})</span></span>
              <span class="bot-status">${b.status}</span>
            </div>
            <div class="bot-details">
              <div>Skin: <b>${b.skin}</b></div>
              <div>Uptime: <b>${b.uptime}</b></div>
              <div>Pos: ${b.pos}</div>
              <div>Ping: ${b.ping}ms</div>
            </div>
            <div class="bot-logs">${b.logs.join('<br>')}</div>
            <div class="actions-row">
              <input type="text" id="chat_${b.id}" placeholder="Send chat message..." style="margin-bottom:0; font-size:12px; padding:6px;">
              <button class="btn-secondary" onclick="sendChat('${b.id}')">Chat</button>
              <button class="btn-danger" onclick="stopBot('${b.id}')">Stop</button>
            </div>
          </div>
        `).join('');
      }

      // Proxy down render
      const proxyContainer = document.getElementById('proxy-down-container');
      if (data.proxyDown.length === 0) {
        proxyContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 13px;">No bots with dead proxies.</p>';
      } else {
        proxyContainer.innerHTML = data.proxyDown.map(b => `
          <div class="bot-card" style="border-color: var(--danger);">
            <div class="bot-header">
              <span>${b.username} <span style="font-size:11px; color:var(--text-muted);">(${b.server})</span></span>
              <span style="color:var(--danger); font-size:12px;">Proxy DEAD</span>
            </div>
            <div class="bot-details">
              <div>Skin: ${b.skin}</div>
              <div>Uptime Saved: ${b.uptime}</div>
            </div>
            <button onclick="reviveBot('${b.id}')" style="background:var(--success); color:white; font-size:12px; padding:6px;">Revive with New Proxy</button>
          </div>
        `).join('');
      }
    });

    function sendChat(id) {
      const msg = document.getElementById('chat_' + id).value;
      if (msg) socket.emit('bot_chat', { id, message: msg });
      document.getElementById('chat_' + id).value = '';
    }

    function stopBot(id) {
      socket.emit('stop_bot', id);
    }

    function reviveBot(id) {
      const newProxy = prompt('Enter new SOCKS5 proxy for this bot:');
      if (newProxy) {
        socket.emit('recover_proxy_down', { botIds: [id], newProxy });
      }
    }

    function addStaff() {
      const name = document.getElementById('new-staff').value;
      if (name) {
        socket.emit('add_staff', name);
        document.getElementById('new-staff').value = '';
      }
    }

    function removeStaff(name) {
      socket.emit('remove_staff', name);
    }
  </script>
</body>
</html>
